<style>
:root{--bg:#f3ece3;--sf:#fffdf9;--s2:#f4ebf0;--ln:#e3d6c3;--ink:#2a1f2b;--mu:#76687a;--ac:#6b2c6e;--pk:#c4005a;--au:#a8822e;--ok:#2f7a4f;--wn:#9a6700;--er:#b42318;--sh:0 2px 10px rgba(60,35,30,.07);--hd:#34143b;--g1:linear-gradient(120deg,#2b1031 0%,#4f1a52 50%,#86205f 100%);--g2:linear-gradient(135deg,#6b2c6e,#b0246b);--txt:Calibri,"Carlito",Arial,sans-serif;--dw:600;--ds:1.04}
body.dark{--bg:#17121b;--sf:#211a26;--s2:#2b2331;--ln:#3b3044;--ink:#efe7dc;--mu:#b3a6b6;--ac:#d6a5dc;--pk:#ff5aa0;--au:#d8b25a;--ok:#5cc58e;--wn:#e0b04a;--er:#f08080;--sh:0 2px 12px rgba(0,0,0,.35);--hd:#241328}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 520px at 100% -10%,rgba(232,0,106,.08),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(107,44,110,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:17px/1.6 var(--txt);min-height:100vh}
.f-literaria{--txt:"Alegreya",Georgia,serif;--ds:1.06}
.f-clasica{--txt:"Lora",Georgia,serif;--ds:1}
.f-amable{--txt:"Nunito",system-ui,sans-serif;--ds:1}.f-legible{--txt:"Atkinson Hyperlegible",system-ui,sans-serif;--ds:1}.f-comic{--txt:"Comic Neue","Comic Sans MS",system-ui,sans-serif;--ds:1.04}.f-elegante{--txt:"Playfair Display",Georgia,serif;--ds:1}
.f-oficial{--txt:Calibri,"Carlito",Arial,sans-serif;--ds:1.04}
.f-lectura{--txt:"Lexend",system-ui,sans-serif;--ds:1}
b,strong{font-weight:600}
.staff{background:repeating-linear-gradient(180deg,rgba(255,255,255,.08) 0 1px,transparent 1px 10px) 0 50%/100% 41px no-repeat,var(--g1)}
header{color:#fff;padding:12px 20px;position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:0;box-shadow:0 3px 0 0 #c99a3c,0 8px 24px rgba(52,20,59,.25)}
.logo{width:54px;height:54px;background:#f4ead5;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.tit{font-family:var(--txt)}
.tit b{font-weight:700;font-size:calc(19px*var(--ds));line-height:1.15;display:block;letter-spacing:.2px}
.tit small{display:block;font-weight:600;font-size:11px;line-height:1.5;letter-spacing:2.2px;opacity:.85}
.tit i{display:block;font-style:normal;font-weight:600;font-size:12px;opacity:.55}
header select{margin-left:18px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 10px}
header option{color:#000}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;color:#f1e4ef;border:0;padding:7px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:15px}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:#fffdf8;color:var(--hd)}
body.dark nav button.on{background:var(--au);color:#1b1410}
main{max-width:1320px;margin:auto;padding:20px 24px 60px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 2px rgba(60,35,30,.04),0 8px 28px rgba(60,35,30,.06)}
h2{font-family:var(--txt);font-weight:var(--dw);font-size:calc(24px*var(--ds));line-height:1.25;margin:0 0 12px;color:var(--ac)}
h2::after{content:"";display:block;width:44px;height:2px;background:var(--au);margin-top:8px;border-radius:2px}
.row>h2::after,h2[style*="margin:0"]::after{display:none}
h3{font-family:var(--txt);font-weight:var(--dw);font-size:calc(19px*var(--ds));line-height:1.3;margin:0 0 8px;color:var(--ac)}
.mu{color:var(--mu)}.sm{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
button,input,select,textarea{font:inherit}
input,select,textarea{padding:8px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.7;padding:10px 14px}
textarea.big{min-height:280px;background-image:repeating-linear-gradient(180deg,transparent 0 calc(1.7em - 1px),var(--ln) calc(1.7em - 1px) 1.7em);background-attachment:local;background-position:0 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--au);outline-offset:1px}
label.f{display:block;font:600 12px/1.4 var(--txt);letter-spacing:.8px;text-transform:uppercase;margin:12px 0 5px;color:var(--mu)}
.b{background:var(--g2);color:#fff;box-shadow:0 2px 8px rgba(160,36,107,.22);transition:transform .15s,box-shadow .15s;border:0;border-radius:10px;padding:8px 15px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;text-decoration:none;font-size:15px}
body.dark .b{color:#1b1410}
.b:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(160,36,107,.3)}.b:active{transform:none}
.b.s{background:var(--sf);color:var(--ink);border:1px solid var(--ln);box-shadow:none}
.b.s:hover{border-color:var(--au)}
.b.r{background:var(--er);color:#fff;box-shadow:none}
.b.ia{background:var(--sf);color:var(--ink);border:1px solid var(--ln);box-shadow:none}
.b.ia::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,#999)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{color:var(--au);font:600 12px/1.4 var(--txt);letter-spacing:.8px;text-transform:uppercase;text-align:left;border-bottom:2px solid var(--ln)!important}
td,th{padding:8px;border-bottom:1px solid var(--ln);vertical-align:top}
tr[onclick]:hover td{background:var(--s2)}
.pill{padding:1px 10px;border-radius:99px;font-size:13px;background:var(--s2);border:1px solid var(--ln);white-space:nowrap;font-style:italic}
.pill.ok{color:var(--ok)}.pill.wn{color:var(--wn)}.pill.er{color:var(--er)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:6px 15px;cursor:pointer;font-size:15px}
.steps button.on{background:var(--g2);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(160,36,107,.25)}
body.dark .steps button.on{color:#1b1410}
.chk li{margin:4px 0}.chk .ok{color:var(--ok)}.chk .wn{color:var(--wn)}.chk .er{color:var(--er)}
details.ap{border:1px solid var(--ln);border-left:3px solid var(--au);border-radius:10px;padding:9px 16px;margin:8px 0;background:var(--sf)}
details.ap>summary{display:flex;gap:10px;align-items:center;cursor:pointer;font-family:var(--txt);font-weight:var(--dw);font-size:calc(17px*var(--ds));line-height:1.4}
.bar-r{display:flex;align-items:center;gap:8px;margin:6px 0}
.bl{width:160px;font-size:14px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;background:var(--s2);border-radius:99px;height:12px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--pk))}
.bn{width:40px;text-align:right;font-size:14px}
.k{display:flex;flex-direction:column;gap:2px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 60px 14px 20px;position:relative;overflow:hidden}.k:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--ac))}.k i.ic{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,#6b2c6e) 14%,transparent);color:var(--kc,var(--ac));font-style:normal}
.k strong{color:var(--kc,var(--ac));font-family:var(--txt);font-weight:var(--dw);font-size:calc(24px*var(--ds));line-height:1.3;color:var(--ac)}.k span{font-size:14px;color:var(--mu);font-style:italic}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.auth{width:min(440px,100%);border:1px solid var(--ln);border-radius:20px;background:var(--sf);box-shadow:0 24px 70px rgba(60,35,30,.16);overflow:hidden}
.auth-brand{padding:26px;color:#fff;display:flex;gap:14px;align-items:center;border-bottom:0;box-shadow:0 3px 0 0 #c99a3c,0 8px 24px rgba(52,20,59,.25)}
.auth-main{padding:22px 26px 26px}
.auth-main input{width:100%}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{border:0;border-radius:9px;padding:8px;background:none;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--sf);box-shadow:var(--sh)}
#modal{position:fixed;inset:0;background:#0009;display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;z-index:30}
#modal>div{background:var(--sf);color:var(--ink);border-radius:16px;padding:20px;width:min(720px,100%)}
#toast{position:fixed;bottom:26px;right:26px;z-index:60;display:none;align-items:center;gap:12px;min-width:280px;max-width:min(440px,92vw);padding:14px 18px 14px 14px;border-radius:14px;background:var(--sf);color:var(--ink);font-size:17px;font-weight:600;border:1px solid var(--ln);border-left:6px solid var(--ok);box-shadow:0 14px 40px rgba(40,20,45,.22)}
#toast.on{display:flex;animation:entra .28s ease-out}
#toast .ti{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ok);font-size:17px}
#toast.e{border-left-color:var(--er)}#toast.e .ti{background:var(--er)}
@keyframes entra{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@media(max-width:640px){#toast{top:auto;bottom:16px;right:50%;transform:translateX(50%)}#toast.on{animation:none}}
.est{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:700;padding:6px 14px;border-radius:99px;white-space:nowrap;font-style:normal}
.est.cerrada{background:#dff3e6;color:#17663d;border:1px solid #9fd7b4}.est.porcerrar{background:#fff1d6;color:#8a5a00;border:1px solid #f0c66b}.est.borrador{background:#fde7ee;color:#a3245a;border:1px dashed #e28aae}
body.dark .est.cerrada{background:#163626;color:#7fe0a8;border-color:#2f6b49}body.dark .est.porcerrar{background:#3a2c10;color:#f3c867;border-color:#6b5320}body.dark .est.borrador{background:#3a1626;color:#ff9cc4;border-color:#7a3352}
.lista-actas{display:flex;flex-direction:column;gap:10px}
.fila{display:grid;grid-template-columns:64px 1fr 1fr auto auto;gap:14px;align-items:center;padding:14px 18px;border:1px solid var(--ln);border-left:6px solid var(--fc);border-radius:14px;background:var(--sf);cursor:pointer;transition:transform .12s,box-shadow .12s}
.fila:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(60,35,30,.08)}
.fila.cerrada{--fc:#2f9a5e}.fila.porcerrar{--fc:#e0a12a}.fila.borrador{--fc:#e05a93;background:linear-gradient(90deg,rgba(224,90,147,.06),transparent 40%),var(--sf)}
.fila .n{font-size:26px;font-weight:700;color:var(--ac)}.fila .d{font-size:17px}.fila .d small{display:block;color:var(--mu);font-size:13px}
@media(max-width:700px){.fila{grid-template-columns:48px 1fr auto}.fila .ccp,.fila .ab{display:none}}
.progreso{display:flex;align-items:center;gap:14px;margin:4px 0 18px}.progreso .bt{height:14px}.progreso .bt i{background:linear-gradient(90deg,#2f9a5e,#5cc58e)}
.steps button .ok{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#2f9a5e;color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.steps button.on .ok{background:#fff;color:#2f9a5e}
.libro{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.libro .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,#a8822e 15%,transparent);color:#a8822e;flex:none}

.campos{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start;margin-bottom:6px}
.campos>div{display:flex;flex-direction:column;min-width:0}
.campos label.f{margin-top:0}
.campos input,.campos select{width:100%;height:44px;box-sizing:border-box}
.w-s{width:120px}.w-m{width:190px}.w-l{flex:1 1 300px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);cursor:pointer}
.chips label:has(input:checked){border-color:var(--ac);background:var(--s2)}
.nota{background:var(--s2);border-left:3px solid var(--au);border-radius:8px;padding:8px 12px;margin:12px 0}
details.ap.ap-cerrada{border-left-color:#2f9a5e;background:linear-gradient(90deg,rgba(47,154,94,.06),transparent 40%),var(--sf)}details.ap.ap-borrador{border-left-color:#e28aae;border-left-style:dashed}details.ap.ap-porcerrar{border-left-color:#e7b45a}
.drive{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:6px}

 if(!confirm('¿Usar esta imagen como membrete de las actas?'))return;await q(sb.from('actas_ajustes').upsert({clave:'plantilla',valor:{img:data},actualizado:new Date().toISOString()},{onConflict:'clave'}));S.memb=data;toast('Plantilla guardada');verMemb()}catch(x){toast(x.message||'No se pudo leer la plantilla',1)}}
async function plantillaDefecto(){if(!confirm('¿Volver a la plantilla original de la app?'))return;await q(sb.from('actas_ajustes').delete().eq('clave','plantilla'));S.memb=null;toast('Plantilla original restaurada');verMemb()}
async function guardaG(){await q(sb.from('actas_ajustes').upsert({clave:'enlaces',valor:S.G,actualizado:new Date().toISOString()},{onConflict:'clave'}));toast('Carpetas guardadas');render()}
async function listaAut(){const L=await q(sb.from('actas_autorizados').select('*').order('creado'));$('#autl').innerHTML=L.map(a=>`<div class="row"><span style="flex:1">${esc(a.email)} <span class="mu sm">${esc(a.nombre||'')}</span></span>${a.email.toLowerCase()==S.user.email.toLowerCase()?'<span class="pill">tú</span>':`<button class="b s" onclick="delAut('${esc(a.email)}')">Quitar acceso</button>`}</div>`).join('')}
async function addAut(){const e=$('#au').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Escribe un correo válido',1);await q(sb.from('actas_autorizados').insert({email:e,nombre:$('#an').value.trim()}));toast('Acceso concedido');listaAut()}
async function delAut(e){if(!confirm('¿Quitar el acceso a '+e+'?'))return;await q(sb.from('actas_autorizados').delete().eq('email',e));listaAut()}
async function guardaCurso(){const f=S.cfg;f.nombre=f.nombre.trim();if(!/^\d{4}-\d{2}$/.test(f.nombre))return toast('El curso debe tener el formato 2026-27',1);f.config.miembros=f.config.miembros.filter(m=>m.nombre.trim()).map(m=>({...m,nombre:m.nombre.trim()}));
 if(f.config.miembros.length&&!f.config.miembros.some(m=>m.jefe))return toast('Marca quién es el jefe de departamento',1);
 if(!f.id){const ex=S.cursos.find(c=>c.nombre==f.nombre);if(ex){if(!confirm('El curso '+f.nombre+' ya existe. ¿Guardar estos datos en él (integrantes, horarios y enlaces)?'))return;f.id=ex.id}}
 const r=f.id?await q(sb.from('actas_cursos').update({nombre:f.nombre,config:f.config}).eq('id',f.id).select().single()):await q(sb.from('actas_cursos').insert({nombre:f.nombre,config:f.config}).select().single());
 S.cfg=null;S.cid=r.id;S.cursos=await q(sb.from('actas_cursos').select('*').order('nombre',{ascending:false}));await cargarCurso();toast('Curso guardado');render()}
async function borraCurso(){if(!confirm('¿Eliminar el curso '+S.cfg.nombre+' con todas sus actas, actividades, material y programación de la app? No se puede deshacer.'))return;if(!confirm('Los documentos de Drive no se tocan, pero lo guardado en la app se perderá. ¿Seguro?'))return;if(prompt('Para confirmar, escribe BORRAR')!=='BORRAR')return toast('No se ha borrado nada');await q(sb.from('actas_cursos').delete().eq('id',S.cfg.id));S.cfg=null;S.cid=null;cargar()}

cargar();
</script>
<script>(function(){var U=['supabase.min.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'];
function arranca(){var s=document.createElement('script');s.text=document.getElementById('app-main').textContent;document.body.appendChild(s)}
function carga(i){if(window.supabase)return arranca();if(i>=U.length){document.getElementById('app').innerHTML='<div style="padding:28px;font:15px system-ui">No se pudo cargar la librería de Supabase. Comprueba la conexión y recarga.</div>';return}
var s=document.createElement('script');s.src=U[i];s.onload=function(){window.supabase?arranca():carga(i+1)};s.onerror=function(){carga(i+1)};document.head.appendChild(s)}
carga(0)})();</script>
</body></html>
