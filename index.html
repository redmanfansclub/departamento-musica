async function auth(m){const e=$('#ae').value.trim(),p=$('#ap')?.value;try{
 if(m=='in'){const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return authView('in',error.message=='Invalid login credentials'?'El correo o la contraseña no son correctos.':error.message,1);return cargar()}
 if(m=='up'){if(!p||p.length<6)return authView('up','La contraseña debe tener al menos 6 caracteres.',1);const{data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return authView('up',error.message,1);return data.session?cargar():authView('in','Te hemos enviado un correo de confirmación. Confírmalo y vuelve a entrar.')}
 const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});authView('in',error?error.message:'Si la cuenta existe, recibirás un enlace para cambiar la contraseña.',!!error)}catch(x){authView(m,'No se ha podido conectar con Supabase.',1)}}

async function cargar(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return authView();S.user=session.user;
 const ok=await q(sb.from('actas_autorizados').select('email').limit(1));
 if(!ok.length)return $('#app').innerHTML=`<div class="auth-shell"><div class="auth"><div class="auth-brand staff"><div class="logo">${LOGO}</div><div class="tit"><b>Departamento de Música</b><small>IES INFANTA ELENA</small></div></div><div class="auth-main"><h3>Tu cuenta no tiene acceso</h3><p class="mu">${esc(S.user.email)} no está en la lista de correos autorizados. Pide al jefe de departamento que lo añada en Configuración.</p><button class="b s" onclick="salir()">Cerrar sesión</button></div></div></div>`;
 S.cursos=await q(sb.from('actas_cursos').select('*').order('nombre',{ascending:false}));
 {const r=await sb.from('actas_ajustes').select('clave,valor');(r.data||[]).forEach(x=>{if(x.clave=='enlaces')S.G=x.valor||{};if(x.clave=='ia')S.IA=x.valor||{}})}
 if(!S.cursos.find(c=>c.id==S.cid))S.cid=S.cursos[0]?.id;
 if(!S.cursos.length){S.view='config';S.cfg=nuevoCfg();}
 await cargarCurso();render()}
async function cargarCurso(){if(!S.cid){S.D=null;return}localStorage.setItem('dm_cid',S.cid);const id=S.cid,prev=cursoPrev();
 const[actas,act,mat,pend,prog,pendPrev]=await Promise.all([
  q(sb.from('actas_actas').select('*').eq('curso_id',id).order('numero')),
  q(sb.from('actas_actividades').select('*').eq('curso_id',id).order('trimestre').order('creado')),
  q(sb.from('actas_material').select('*').eq('curso_id',id).order('fecha')),
  q(sb.from('actas_pendientes').select('*').eq('curso_id',id).order('creado')),
  q(sb.from('actas_programacion').select('*').eq('curso_id',id).maybeSingle()),
  prev?q(sb.from('actas_pendientes').select('*').eq('curso_id',prev.id).order('creado')):[]]);
 S.D={actas,act,mat,pend,prog,pendPrev};S.prog=null}
function cursoPrev(){const i=S.cursos.findIndex(c=>c.id==S.cid);return i>=0?S.cursos[i+1]:null}
async function cambiaCurso(id){S.cid=id;S.ed=null;await cargarCurso();render()}

 ${S.cursos.length?`<select aria-label="Curso" onchange="cambiaCurso(this.value)">${S.cursos.map(c=>`<option value="${c.id}" ${c.id==S.cid?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select>`:''}
 <nav>${nav.map(([k,t])=>`<button class="${v==k?'on':''}" onclick="ir('${k}')">${t}</button>`).join('')}<button onclick="modo()" aria-label="Modo claro u oscuro" title="Modo claro u oscuro"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-2px"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button onclick="salir()">Salir</button></nav></header>

 if(v=='estadisticas')cargaStats();if(v=='biblioteca')cargaBib();if(v=='programacion'&&S.progRef===null)cargaProgRef();if(v=='config'&&$('#autl'))listaAut()}

 if(n.endsWith('.pdf')){if(!window.pdfjsLib){await cargaScript(PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJSW}const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];for(let i=1;i<=doc.numPages;i++){const c=await (await doc.getPage(i)).getTextContent();let s='';c.items.forEach(it=>{s+=it.str+(it.hasEOL?'\n':'')});out.push(s)}return out.join('\n')}
 if(n.endsWith('.txt'))return f.text();throw new Error('Formato no admitido: usa PDF o Word (.docx).')}
const MEMB=/^\s*(Región de Murcia|Consejería de Educación.*|y Cultura|Centro de Promoción del Talento|Centro Digital Avanzado|Avda\. de la Libertad.*|30520 Jumilla.*|www\.iesinfantaelena\.net|I\. ?E\. ?S\.|Infanta Elena|Jumilla|\d{1,3})\s*$/gim;
const limpia=t=>t.normalize('NFKC').replace(MEMB,'').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
function fechaDe(t){let m=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})\b/);if(m)return (m[3].length==2?'20'+m[3]:m[3])+'-'+pad(m[2])+'-'+pad(m[1]);const f=fechasEn(t).find(x=>x.y);return f?f.y+'-'+pad(f.m)+'-'+pad(f.d):''}
function numDe(t,nombre){const m=t.match(/Acta\s*(?:n[ºo°.]?|n[úu]mero)\s*:?\s*(\d+)/i)||String(nombre||'').match(/^n\s*(\d+)/i);return m?+m[1]:null}

function inicioSec(t,k){if(k=='anexos'){const m=[...t.matchAll(/\n\s*ANEXO I\s*\n/g)];return m.length?m[m.length-1].index:-1}const m=[...t.matchAll(new RegExp('\\n\\s*'+k+'\\.\\s+'+PROG_RE[k],'gi'))];return m.length?m[m.length-1].index:-1}

function vBib(){const pr=cursoPrev()?.nombre||'';return `<div class="card"><h2>Biblioteca de referencia</h2><p class="mu sm">Arrastra aquí los libros de actas, las actas de la CCP y la programación. La app guarda solo el texto, no el archivo: los libros se separan por actas numeradas y la IA los usa como modelo; la programación se usa para consultarla y revisar la nueva.</p>
 <div class="grid2"><div><label class="f" for="bt">Qué vas a subir</label><select id="bt">${opt(TIPOS_BIB,'libro')}</select></div><div><label class="f" for="bc">Curso</label><input id="bc" placeholder="2025-26" value="${esc(pr)}"></div></div>
 <label class="drop" ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="event.preventDefault();this.classList.remove('on');bibArchivos(event.dataTransfer.files)"><b>Arrastra aquí uno o varios archivos</b><span class="mu sm">PDF o Word (.docx) · o pulsa para elegirlos</span><input type="file" multiple accept=".pdf,.docx" hidden onchange="bibArchivos(this.files)"></label><div id="bibest" aria-live="polite"></div></div>
 <div class="card"><h3>Guardado</h3><div id="bibl"><p class="mu">Cargando…</p></div></div>`}
function partirLibro(t){const ms=[...t.matchAll(/(?:ACTA\s+DE\s+(?:LA\s+)?REUNI[ÓO]N\s+DEL\s+DEPARTAMENTO\s+DE\s+M[ÚU]SICA\s*)?Acta\s*n[ºo°.]?\s*(\d+)\s*Fecha\s*:/gi)];return ms.map((m,i)=>({numero:+m[1],texto:t.slice(m.index,i+1<ms.length?ms[i+1].index:undefined).trim()}))}
async function bibArchivos(files){files=[...(files||[])];if(!files.length)return;const tipo=$('#bt').value,curso=$('#bc').value.trim(),st=$('#bibest');if(!/^\d{4}-\d{2}$/.test(curso))return toast('Escribe el curso con el formato 2025-26',1);
 try{const{data:ex}=await sb.from('actas_biblioteca').select('id,curso').eq('tipo',tipo);
  if(tipo=='programacion'&&ex.length&&!confirm('Ya hay una programación guardada ('+[...new Set(ex.map(x=>x.curso))].join(', ')+'). Se borrará y se guardará la nueva, para no repetir texto. ¿Continuar?'))return;
  if(tipo=='libro'&&ex.some(x=>x.curso==curso)&&!confirm('Ya hay un libro de actas del curso '+curso+'. Se sustituirá por el nuevo. ¿Continuar?'))return;
  let filas=[];for(const f of files){st.innerHTML='<span class="spin"></span>Leyendo '+esc(f.name)+'…';const tx=limpia(await leeArchivo(f));if(tx.length<100){toast(f.name+': no se encontró texto (¿PDF escaneado?)',1);continue}
   if(tipo=='libro'){const a=partirLibro(tx);if(!a.length){toast(f.name+': no se encontraron actas numeradas',1);continue}a.forEach(x=>filas.push({curso,tipo,numero:x.numero,titulo:'Acta nº '+x.numero,texto:x.texto}))}
   else if(tipo=='ccp'){const n=numDe(tx,f.name);filas.push({curso,tipo,numero:n,titulo:'CCP'+(n?' nº '+n:'')+' · '+f.name,texto:tx})}
   else filas=[{curso,tipo,numero:null,titulo:'Programación '+curso,texto:tx}]}
  if(!filas.length){st.innerHTML='';return}
  if(tipo=='programacion')await q(sb.from('actas_biblioteca').delete().eq('tipo','programacion'));
  if(tipo=='libro')await q(sb.from('actas_biblioteca').delete().eq('tipo','libro').eq('curso',curso));
  for(let i=0;i<filas.length;i+=20)await q(sb.from('actas_biblioteca').insert(filas.slice(i,i+20)));
  st.innerHTML=`<p style="color:var(--ok)">Guardado: ${filas.length} ${tipo=='libro'?'actas':tipo=='ccp'?'actas de la CCP':'programación'} del curso ${esc(curso)}.</p>`;if(tipo=='programacion')S.progRef=null;cargaBib()}
 catch(x){st.innerHTML='<p style="color:var(--er)">'+esc(x.message||'Error al leer el archivo')+'</p>'}}
const kb=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
async function cargaBib(){const el=$('#bibl');if(!el)return;try{const{data}=await sb.from('actas_biblioteca').select('id,curso,tipo,numero,titulo,texto').order('curso',{ascending:false}).order('numero');S.bib=data||[];
 if(!S.bib.length)return el.innerHTML='<p class="mu">Todavía no hay nada guardado.</p>';const tot=S.bib.reduce((n,x)=>n+x.texto.length,0),grupos={};S.bib.forEach(x=>{(grupos[x.curso+'|'+x.tipo]=grupos[x.curso+'|'+x.tipo]||[]).push(x)});
 el.innerHTML=`<p class="mu sm">Ocupa en total unos ${kb(tot)}.</p><div class="tw"><table><thead><tr><th>Curso</th><th>Tipo</th><th>Contenido</th><th>Tamaño</th><th></th></tr></thead><tbody>${Object.entries(grupos).map(([g,L])=>{const[cu,ti]=g.split('|'),ns=L.map(x=>x.numero).filter(n=>n!=null);return `<tr><td>${esc(cu)}</td><td>${TIPOS_BIB[ti]}</td><td>${ti=='programacion'?'Texto completo':L.length+(ti=='libro'?' actas':' actas de la CCP')+(ns.length?' (nº '+Math.min(...ns)+'–'+Math.max(...ns)+')':'')}</td><td>${kb(L.reduce((n,x)=>n+x.texto.length,0))}</td><td style="white-space:nowrap"><button class="b s" onclick="verBib('${esc(g)}')">Ver</button> <button class="b s" onclick="borraBib('${esc(g)}')">Borrar</button></td></tr>`}).join('')}</tbody></table></div>`}catch(x){el.innerHTML='<p style="color:var(--er)">No se pudo cargar. ¿Has ejecutado el SQL nuevo en Supabase?</p>'}}
function verBib(g){const[cu,ti]=g.split('|'),L=S.bib.filter(x=>x.curso==cu&&x.tipo==ti);modal(`<h3>${TIPOS_BIB[ti]} · ${esc(cu)}</h3>${L.map(x=>`<details class="ap"><summary>${esc(x.titulo||'')}</summary><textarea class="big" readonly>${esc(x.texto)}</textarea></details>`).join('')}<div class="row"><button class="b" onclick="cerrar()">Cerrar</button></div>`)}
async function borraBib(g){const[cu,ti]=g.split('|');if(!confirm('¿Borrar '+TIPOS_BIB[ti].toLowerCase()+' del curso '+cu+' de la Biblioteca?'))return;if(!confirm('Se borrará el texto guardado. Los archivos de Drive no se tocan. ¿Seguro?'))return;if(prompt('Para confirmar, escribe BORRAR')!=='BORRAR')return toast('No se ha borrado nada');await q(sb.from('actas_biblioteca').delete().eq('curso',cu).eq('tipo',ti));if(ti=='programacion')S.progRef=null;toast('Borrado');cargaBib()}

/* ---------- Estadísticas ---------- */
const barras=(arr,max)=>arr.map(([l,n])=>`<div class="bar-r"><span class="bl" title="${esc(l)}">${esc(l)}</span><span class="bt"><i style="width:${max?Math.round(n/max*100):0}%"></i></span><span class="bn">${n}</span></div>`).join('');
function vStats(){return '<div id="stats"><div class="card"><p class="mu">Cargando estadísticas…</p></div></div>'}
async function cargaStats(){const ids=S.cursos.map(c=>c.id);
 const[A,AC,M,P]=await Promise.all([q(sb.from('actas_actas').select('curso_id,numero,notas,texto_final,ccp_texto').in('curso_id',ids)),q(sb.from('actas_actividades').select('curso_id,estado').in('curso_id',ids)),q(sb.from('actas_material').select('curso_id,tipo,cantidad').in('curso_id',ids)),q(sb.from('actas_programacion').select('curso_id,datos,apartados').in('curso_id',ids))]);
 const cs=[...S.cursos].reverse(),nom=id=>S.cursos.find(c=>c.id==id)?.nombre;
 const porCurso=cs.map(c=>[c.nombre,A.filter(a=>a.curso_id==c.id).length]),mx=Math.max(1,...porCurso.map(x=>x[1]));
 const actC=A.filter(a=>a.curso_id==S.cid),temas=Object.entries(TEMAS).map(([t,r])=>[t,actC.filter(a=>r.test((a.notas||'')+' '+(a.texto_final||''))).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),mt=Math.max(1,...temas.map(x=>x[1]));
 const acts=cs.map(c=>{const x=AC.filter(a=>a.curso_id==c.id);return[c.nombre,x.filter(a=>a.estado=='realizada').length,x.filter(a=>a.estado=='no_realizada').length,x.filter(a=>a.estado=='prevista').length]});
 const mat=cs.map(c=>{const x=M.filter(a=>a.curso_id==c.id),s=t=>x.filter(a=>a.tipo==t).reduce((n,a)=>n+(a.cantidad||0),0);return[c.nombre,s('alta'),s('baja'),s('rotura')]});
 const pond=cs.map(c=>{const d=P.find(p=>p.curso_id==c.id)?.datos;return[c.nombre,d]}).filter(x=>x[1]);
 const sim=cs.map((c,i)=>{if(!i)return null;const a=P.find(p=>p.curso_id==cs[i-1].id)?.apartados,b=P.find(p=>p.curso_id==c.id)?.apartados;if(!a||!b)return null;const r=parecido(Object.values(a).map(x=>x.texto||'').join(' '),Object.values(b).map(x=>x.texto||'').join(' '));return r==null?null:[cs[i-1].nombre+' → '+c.nombre,r]}).filter(Boolean);
 $('#stats').innerHTML=`<div class="grid2"><div class="card"><h3>Actas por curso</h3>${barras(porCurso,mx)}</div>
 <div class="card"><h3>Temas más tratados · ${esc(C().nombre)}</h3><p class="mu sm">Nº de actas que tratan cada tema.</p>${temas.length?barras(temas,mt):'<p class="mu">Aún no hay actas con texto.</p>'}</div></div>
 <div class="card"><h3>Actividades complementarias y extraescolares</h3><div class="tw"><table><thead><tr><th>Curso</th><th>Realizadas</th><th>No realizadas</th><th>Sin confirmar</th><th>% realizadas</th></tr></thead><tbody>${acts.map(([c,r,n,p])=>`<tr><td>${esc(c)}</td><td>${r}</td><td>${n}</td><td>${p}</td><td>${r+n?Math.round(r/(r+n)*100)+' %':'—'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="grid2"><div class="card"><h3>Material</h3><div class="tw"><table><thead><tr><th>Curso</th><th>Altas</th><th>Bajas</th><th>Roturas</th></tr></thead><tbody>${mat.map(([c,a,b,r])=>`<tr><td>${esc(c)}</td><td>${a}</td><td>${b}</td><td>${r}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>Profesorado por curso</h3>${cs.map(c=>`<p><b>${esc(c.nombre)}</b><br>${miembros(c.config).map(m=>esc(nomF(m))).join('<br>')||'<span class="mu">Sin datos</span>'}</p>`).join('')}</div></div>
 <div class="card"><h3>Programación</h3>${pond.length?`<div class="tw"><table><thead><tr><th>Curso</th><th>ESO teoría</th><th>ESO práctica</th><th>Desglose</th><th>Bachillerato</th><th>Plan lector</th><th>SA</th></tr></thead><tbody>${pond.map(([c,d])=>`<tr><td>${esc(c)}</td><td>${d.pond_eso_teoria??'—'} %</td><td>${d.pond_eso_practica??'—'} %</td><td>${esc(d.pond_eso_detalle||'—')}</td><td>${esc(d.pond_bach||'—')}</td><td>${esc(d.plan_lector||'—')}</td><td>${(d.materias||[]).reduce((n,m)=>n+(+m.sa||0),0)||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mu">Guarda los datos clave de la programación para comparar cursos.</p>'}
 ${sim.length?'<h3 style="margin-top:14px">Texto que se mantiene de un curso a otro</h3>'+barras(sim.map(([l,r])=>[l,Math.round(r*100)]),100).replace(/<span class="bn">(\d+)<\/span>/g,'<span class="bn">$1 %</span>'):''}</div>`}
function parecido(a,b){const w=s=>s.toLowerCase().match(/[a-záéíóúñü]{3,}/g)||[];const A=w(a),B=w(b);if(A.length<50||B.length<50)return null;const tri=x=>{const s=new Set;for(let i=0;i<x.length-2;i++)s.add(x[i]+' '+x[i+1]+' '+x[i+2]);return s};const ta=tri(A),tb=tri(B);let n=0;tb.forEach(t=>ta.has(t)&&n++);return n/Math.max(ta.size,tb.size)}

/* ---------- Configuración ---------- */
function nuevoCfg(base){const y=new Date().getMonth()>=7?new Date().getFullYear():new Date().getFullYear()-1;const c=base?JSON.parse(JSON.stringify(base.config||{})):{};delete c.enlaces;return{id:null,nombre:base?'':y+'-'+String(y+1).slice(2),config:Object.assign({ccp:{dia:1,ini:'11:45',fin:'12:40'},dep:{dia:1,ini:'12:40',fin:'13:35'},miembros:[{trat:'D.',nombre:'Manuel Esteve Martínez',jefe:true}],enlaces:{}},c)}}
function editCurso(id){const c=S.cursos.find(x=>x.id==id);S.cfg=JSON.parse(JSON.stringify(c));render()}
function cfgSet(path,v){const k=path.split('.');let o=S.cfg;for(let i=0;i<k.length-1;i++)o=o[k[i]]=o[k[i]]??{};o[k[k.length-1]]=v}
function vConfig(){const f=S.cfg,dias=[1,2,3,4,5].map(d=>[d,DIAS[d]]);
 const selD=(p,v)=>`<select onchange="cfgSet('${p}',+this.value)">${dias.map(([d,t])=>`<option value="${d}" ${d==v?'selected':''}>${t}</option>`).join('')}</select>`;
 const EN=[['libro','Libro de actas de este curso (Google Docs)'],['programacion','Programación de este curso']];
 let h=`<div class="card"><h2>Cursos</h2>${S.cursos.length?`<div class="tw"><table><tbody>${S.cursos.map(c=>`<tr><td><b>${esc(c.nombre)}</b></td><td class="mu sm">${miembros(c.config).length} integrantes</td><td><button class="b s" onclick="editCurso('${c.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`:'<p>Crea el primer curso para empezar. Puedes crear también los cursos anteriores para tener sus enlaces a mano.</p>'}
 <div class="row" style="margin-top:10px"><button class="b" onclick="S.cfg=nuevoCfg();render()">Nuevo curso</button>${C()?`<button class="b s" onclick="S.cfg=nuevoCfg(C());render()">Nuevo curso a partir de ${esc(C().nombre)}</button>`:''}</div></div>`;
 if(f)h+=`<div class="card"><h2>${f.id?'Editar curso '+esc(f.nombre):'Nuevo curso'}</h2><label class="f" for="cn">Curso escolar</label><input id="cn" value="${esc(f.nombre)}" placeholder="2026-27" oninput="S.cfg.nombre=this.value">
 <div class="grid2"><div><h3 style="margin-top:14px">CCP</h3><div class="row">${selD('config.ccp.dia',f.config.ccp?.dia)}<input type="time" value="${f.config.ccp?.ini||''}" oninput="cfgSet('config.ccp.ini',this.value)" aria-label="Inicio CCP"><input type="time" value="${f.config.ccp?.fin||''}" oninput="cfgSet('config.ccp.fin',this.value)" aria-label="Fin CCP"></div></div>
 <div><h3 style="margin-top:14px">Reunión de departamento</h3><div class="row">${selD('config.dep.dia',f.config.dep?.dia)}<input type="time" value="${f.config.dep?.ini||''}" oninput="cfgSet('config.dep.ini',this.value)" aria-label="Inicio reunión"><input type="time" value="${f.config.dep?.fin||''}" oninput="cfgSet('config.dep.fin',this.value)" aria-label="Fin reunión"></div></div></div>
 <h3 style="margin-top:14px">Periodo lectivo</h3><p class="mu sm">Dentro de estas fechas, las actas van siempre en el día y la hora de la reunión de departamento. Fuera, la fecha y la hora son libres.</p><div class="row"><label class="sm">Inicio de clases <input type="date" value="${f.config.lectivo?.ini||''}" onchange="cfgSet('config.lectivo.ini',this.value)"></label><label class="sm">Fin de clases <input type="date" value="${f.config.lectivo?.fin||''}" onchange="cfgSet('config.lectivo.fin',this.value)"></label></div>
 <h3 style="margin-top:14px">Integrantes del Departamento de Música</h3><p class="mu sm">Nombre y apellidos tal como deben ir en las firmas. Marca quién es el jefe de departamento.</p>
 ${f.config.miembros.map((m,i)=>`<div class="row"><select onchange="cfgSet('config.miembros.${i}.trat',this.value)">${['D.','Dña.'].map(t=>`<option ${m.trat==t?'selected':''}>${t}</option>`).join('')}</select><input style="flex:1;min-width:200px" value="${esc(m.nombre)}" placeholder="Nombre y apellidos" oninput="cfgSet('config.miembros.${i}.nombre',this.value)"><label class="sm"><input type="radio" name="jefe" ${m.jefe?'checked':''} onchange="S.cfg.config.miembros.forEach((x,j)=>x.jefe=j==${i})"> Jefe de departamento</label><button class="b s" aria-label="Quitar" onclick="S.cfg.config.miembros.splice(${i},1);render()">✕</button></div>`).join('')}
 <button class="b s" onclick="S.cfg.config.miembros.push({trat:'D.',nombre:'',jefe:false});render()">Añadir integrante</button>
 <h3 style="margin-top:16px">Archivos de este curso (opcional)</h3><p class="mu sm">Solo si quieres un acceso directo al documento concreto. Las carpetas se configuran una vez más abajo.</p>${EN.map(([k,t])=>`<label class="f">${t}</label><input style="width:100%" value="${esc(f.config.enlaces?.[k]||'')}" placeholder="https://drive.google.com/…" oninput="cfgSet('config.enlaces.${k}',this.value.trim())">`).join('')}
 <div class="row" style="margin-top:16px"><button class="b" onclick="guardaCurso()">Guardar curso</button><button class="b s" onclick="S.cfg=null;render()">Cancelar</button>${f.id?`<button class="b r" style="margin-left:auto" onclick="borraCurso()">Eliminar curso</button>`:''}</div></div>`;
 const G=[['carpeta','Carpeta del departamento'],['libros','Carpeta de libros de actas'],['ccp','Carpeta de actas de la CCP'],['programaciones','Carpeta de programaciones'],['normativa','Carpeta de normativa'],['plantilla','Plantilla del acta con membrete (Google Docs)'],['plantilla_prog','Plantilla de la programación']];
 h+=`<div class="card"><h2>Carpetas de Drive</h2><p class="mu sm">Se guardan una sola vez y sirven para todos los cursos. Dentro de cada carpeta, crea una subcarpeta por curso con su nombre (por ejemplo, «2026-27»). Para copiar un enlace: en Drive, botón derecho → Compartir → Copiar enlace.</p>
 ${G.map(([k,t])=>`<label class="f" for="g_${k}">${t}</label><div class="row" style="margin:0"><input id="g_${k}" style="flex:1" value="${esc(S.G[k]||'')}" placeholder="https://drive.google.com/…" oninput="S.G['${k}']=this.value.trim()">${S.G[k]?enl(S.G[k],'Abrir'):''}</div>`).join('')}
 <div class="row" style="margin-top:14px"><button class="b" onclick="guardaG()">Guardar carpetas</button></div></div>`;
 h+=`<div class="card"><h2>Inteligencia artificial</h2><p class="mu sm">Para redactar dentro de la app hace falta la función «actas-ia» en Supabase (ver tutorial). Aquí puedes cambiar el modelo sin tocar el código.</p>
 <div class="grid2"><div><label class="f" for="iac">Modelo de Claude</label><input id="iac" style="width:100%" value="${esc(S.IA.claude||'claude-sonnet-5-5')}"></div><div><label class="f" for="iag">Modelo de Gemini</label><input id="iag" style="width:100%" value="${esc(S.IA.gemini||'gemini-flash-latest')}"></div></div>
 <div class="row" style="margin-top:12px"><button class="b" onclick="guardaIA()">Guardar</button><button class="b s" onclick="pruebaIA('claude')">Probar Claude</button><button class="b s" onclick="pruebaIA('gemini')">Probar Gemini</button><span id="iapr" class="sm"></span></div></div>`;
 const fa=localStorage.getItem('dm_font')||'oficial';
 if(!document.getElementById('gfall')){const l=document.createElement('link');l.id='gfall';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+Object.values(FUENTES).map(f=>'family='+f[2]).join('&')+'&display=swap';document.head.appendChild(l)}
 h+=`<div class="card"><h2>Tipo de letra</h2><p class="mu sm">Cada opción es una sola familia para toda la app. El cambio es inmediato y se guarda en este navegador. El acta y la programación oficiales mantienen su letra; esto solo cambia la app.</p><div class="grid2">${Object.entries(FUENTES).map(([k,[n,d]])=>`<button class="b s f-${k}" style="flex-direction:column;align-items:flex-start;padding:12px 16px;${fa==k?'border:2px solid var(--au)':''}" onclick="fuente('${k}');render()"><span style="font-family:var(--txt);font-weight:var(--dw);font-size:calc(20px*var(--ds))">${n}</span><span style="font-family:var(--txt);font-size:15px">Acta nº 5 · Se procede a la lectura del acta anterior.</span><span class="mu" style="font-size:12px">${d}</span></button>`).join('')}</div></div>`;
 return h+`<div class="card" id="aut"><h2>Acceso</h2><p class="mu sm">Correos que pueden entrar en la app. Para que un compañero entre, añade aquí su correo; después crea su cuenta en «Crear cuenta» o la das de alta tú desde Supabase.</p><div id="autl" class="mu">Cargando…</div>
 <div class="row" style="margin-top:8px"><input id="au" type="email" style="flex:1" placeholder="correo@murciaeduca.es"><input id="an" style="flex:1" placeholder="Nombre"><button class="b s" onclick="addAut()">Autorizar</button></div></div>`}
async function guardaIA(){S.IA={claude:$('#iac').value.trim(),gemini:$('#iag').value.trim()};await q(sb.from('actas_ajustes').upsert({clave:'ia',valor:S.IA,actualizado:new Date().toISOString()},{onConflict:'clave'}));toast('Guardado')}
async function pruebaIA(p){const o=$('#iapr');o.innerHTML='<span class="spin"></span>Probando…';try{const r=await llamaIA(p,'Responde solo con la palabra: Conectado');o.innerHTML='<span style="color:var(--ok)">'+esc(r.slice(0,60))+'</span>'}catch(x){o.innerHTML='<span style="color:var(--er)">'+esc(x.message)+'</span>'}}
async function guardaG(){await q(sb.from('actas_ajustes').upsert({clave:'enlaces',valor:S.G,actualizado:new Date().toISOString()},{onConflict:'clave'}));toast('Carpetas guardadas');render()}
async function listaAut(){const L=await q(sb.from('actas_autorizados').select('*').order('creado'));$('#autl').innerHTML=L.map(a=>`<div class="row"><span style="flex:1">${esc(a.email)} <span class="mu sm">${esc(a.nombre||'')}</span></span>${a.email.toLowerCase()==S.user.email.toLowerCase()?'<span class="pill">tú</span>':`<button class="b s" onclick="delAut('${esc(a.email)}')">Quitar acceso</button>`}</div>`).join('')}
async function addAut(){const e=$('#au').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Escribe un correo válido',1);await q(sb.from('actas_autorizados').insert({email:e,nombre:$('#an').value.trim()}));toast('Acceso concedido');listaAut()}

async function guardaCurso(){const f=S.cfg;f.nombre=f.nombre.trim();if(!/^\d{4}-\d{2}$/.test(f.nombre))return toast('El curso debe tener el formato 2026-27',1);f.config.miembros=f.config.miembros.filter(m=>m.nombre.trim()).map(m=>({...m,nombre:m.nombre.trim()}));
 if(f.config.miembros.length&&!f.config.miembros.some(m=>m.jefe))return toast('Marca quién es el jefe de departamento',1);
 const r=f.id?await q(sb.from('actas_cursos').update({nombre:f.nombre,config:f.config}).eq('id',f.id).select().single()):await q(sb.from('actas_cursos').insert({nombre:f.nombre,config:f.config}).select().single());
 S.cfg=null;S.cid=r.id;S.cursos=await q(sb.from('actas_cursos').select('*').order('nombre',{ascending:false}));await cargarCurso();toast('Curso guardado');render()}
async function borraCurso(){if(!confirm('¿Eliminar el curso '+S.cfg.nombre+' con todas sus actas, actividades, material y programación de la app? No se puede deshacer.'))return;if(!confirm('Los documentos de Drive no se tocan, pero lo guardado en la app se perderá. ¿Seguro?'))return;if(prompt('Para confirmar, escribe BORRAR')!=='BORRAR')return toast('No se ha borrado nada');await q(sb.from('actas_cursos').delete().eq('id',S.cfg.id));S.cfg=null;S.cid=null;cargar()}

cargar();

<script>(function(){var U=['supabase.min.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'];
function arranca(){var s=document.createElement('script');s.text=document.getElementById('app-main').textContent;document.body.appendChild(s)}
function carga(i){if(window.supabase)return arranca();if(i>=U.length){document.getElementById('app').innerHTML='<div style="padding:28px;font:15px system-ui">No se pudo cargar la librería de Supabase. Comprueba la conexión y recarga.</div>';return}
var s=document.createElement('script');s.src=U[i];s.onload=function(){window.supabase?arranca():carga(i+1)};s.onerror=function(){carga(i+1)};document.head.appendChild(s)}
carga(0)})();</script>
